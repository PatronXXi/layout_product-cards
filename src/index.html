<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <article
      data-qa="card"
      class="card"
    >
      <div class="card__img"></div>
      <div class="card__content">
        <h2 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>
        <p class="card__product-code">Product code: 195434</p>
        <div class="card__reviews-row">
          <div class="card__stars">
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
          </div>
          <div class="card__review">Reviews: 5</div>
        </div>
        <div class="card__price-row">
          <span class="card__price-name">Price:</span>
          <span class="card__price-value">$2,199</span>
        </div>
        <div class="card__buy">
          <a
            href="#"
            data-qa="hover"
          >
            buy
          </a>
        </div>
      </div>
    </article>
  </body>
</html>
